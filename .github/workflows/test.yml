name: Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  test-service-container-build:
    name: Build and Test PowerSync Service
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Test Build Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          cache-from: type=registry,ref=stevenontong/${{vars.DOCKER_REGISTRY}}:cache
          context: .
          platforms: linux/amd64
          push: false
          file: ./service/Dockerfile

  run-core-tests:
    name: Core Test
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The mongodb-github-action below doesn't use the Docker credentials for the pull.
      # We pre-pull, so that the image is cached.
      - name: Pre-pull Mongo image
        run: docker pull mongo:8.0

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@90004df786821b6308fb02299e5835d0dae05d0d # 1.12.0
        with:
          mongodb-version: '8.0'
          mongodb-replica-set: test-rs

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        shell: bash
        run: pnpm build

      - name: Test
        run: pnpm test --filter '!./modules/*'

  run-postgres-tests:
    name: Postgres Test
    runs-on: ubuntu-latest
    needs: run-core-tests

    strategy:
      fail-fast: false
      matrix:
        postgres-version: [11, 12, 13, 14, 15, 16, 17]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start PostgreSQL
        run: |
          docker run \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=powersync_test \
            -p 5432:5432 \
            -d postgres:${{ matrix.postgres-version }} \
            -c wal_level=logical

      - name: Start PostgreSQL (Storage)
        run: |
          docker run \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=powersync_storage_test \
            -p 5431:5432 \
            -d postgres:${{ matrix.postgres-version }}

      # The mongodb-github-action below doesn't use the Docker credentials for the pull.
      # We pre-pull, so that the image is cached.
      - name: Pre-pull Mongo image
        run: docker pull mongo:8.0

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@90004df786821b6308fb02299e5835d0dae05d0d # 1.12.0
        with:
          mongodb-version: '8.0'
          mongodb-replica-set: test-rs

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        shell: bash
        run: pnpm build

      - name: Test Replication
        run: pnpm test --filter='./modules/module-postgres'

      - name: Test Storage
        run: pnpm test --filter='./modules/module-postgres-storage'

  run-mysql-tests:
    name: MySQL Test
    runs-on: ubuntu-latest
    needs: run-core-tests

    strategy:
      fail-fast: false
      matrix:
        mysql-version: [5.7, 8.0, 8.4]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start MySQL
        run: |
          docker run \
          --name MySQLTestDatabase \
          -e MYSQL_ROOT_PASSWORD=mypassword \
          -e MYSQL_DATABASE=mydatabase \
          -p 3306:3306 \
          -d mysql:${{ matrix.mysql-version }} \
          --log-bin=/var/lib/mysql/mysql-bin.log \
          --gtid_mode=ON \
          --enforce_gtid_consistency=ON \
          --server-id=1

      # The mongodb-github-action below doesn't use the Docker credentials for the pull.
      # We pre-pull, so that the image is cached.
      - name: Pre-pull Mongo image
        run: docker pull mongo:8.0

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@90004df786821b6308fb02299e5835d0dae05d0d # 1.12.0
        with:
          mongodb-version: '8.0'
          mongodb-replica-set: test-rs

      - name: Start PostgreSQL (Storage)
        run: |
          docker run \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=powersync_storage_test \
            -p 5431:5432 \
            -d postgres:16

      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        shell: bash
        run: pnpm build

      - name: Test Replication
        run: pnpm test --filter='./modules/module-mysql'

  run-mongodb-tests:
    name: MongoDB Test
    runs-on: ubuntu-latest
    needs: run-core-tests

    strategy:
      fail-fast: false
      matrix:
        mongodb-version: ['6.0', '7.0', '8.0']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The mongodb-github-action below doesn't use the Docker credentials for the pull.
      # We pre-pull, so that the image is cached.
      - name: Pre-pull Mongo image
        run: docker pull mongo:${{ matrix.mongodb-version }}

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@90004df786821b6308fb02299e5835d0dae05d0d # 1.12.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-replica-set: test-rs

      - name: Start PostgreSQL (Storage)
        run: |
          docker run \
            --health-cmd pg_isready \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=powersync_storage_test \
            -p 5431:5432 \
            -d postgres:16

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        name: Install pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3.5.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        shell: bash
        run: pnpm build

      - name: Test Replication
        run: pnpm test --filter='./modules/module-mongodb'

      - name: Test Storage
        run: pnpm test --filter='./modules/module-mongodb-storage'
